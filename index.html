<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="hud">
        <div class="hud-item">
          Score <span id="score">0</span>
        </div>
        <div class="hud-item">
          Best <span id="best">0</span>
        </div>
      </header>

      <div class="board-wrap">
        <canvas id="board" width="1200" height="600"></canvas>
        <div id="overlay" class="overlay">
          <p id="overlay-title">Snake</p>
          <p id="overlay-subtitle">Press Space or Enter to start</p>
        </div>
      </div>

      <p class="hint">
        Arrow keys / WASD to move &middot; Space to pause &middot; Enter to
        restart after game over
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
